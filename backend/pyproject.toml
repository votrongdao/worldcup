[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project]
name = "worldcup-orchestrator"
version = "0.1.0"
description = "AI Agentic World Cup orchestration framework (FastAPI, deterministic)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6",
  "pydantic-settings>=2.2", "sqlalchemy>=2.0", "alembic>=1.13",
  "asyncpg>=0.29", "redis>=5.0", "aiohttp>=3.9",
  "azure-servicebus>=7.12", "azure-storage-blob>=12.19", "azure-identity>=1.16",
  "openai>=1.30",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "mypy>=1.10", "ruff>=0.4"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
