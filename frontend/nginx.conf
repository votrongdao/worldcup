server {
    listen 80;
    server_name _;

    # Proxy API calls to the backend. Use Docker's embedded DNS resolver + a
    # variable upstream so nginx RE-RESOLVES `api` on each request — otherwise it
    # caches the IP at startup and 502s after the api container is recreated.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8000;
        rewrite ^/api/(.*)$ /$1 break;     # strip the /api prefix
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
